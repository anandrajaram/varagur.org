---
layout: default
---
<article class="gallery-page">
  {% if page.title %}<h1 class="page-title">{{ page.title }}</h1>{% endif %}
  {{ content }}
  {% if page.images %}
  <div class="gallery">
    {% for img in page.images %}
      <figure class="gallery-item">
        <a href="{{ img.src | relative_url }}">
          <img src="{{ img.src | relative_url }}" alt="{{ img.alt | default: page.title }}" loading="lazy">
        </a>
        {% if img.caption %}<figcaption>{{ img.caption }}</figcaption>{% endif %}
      </figure>
    {% endfor %}
  </div>
  {% endif %}
</article>
