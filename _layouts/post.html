---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.date %}<time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% endif %}
  </header>
  <div class="post-content">
    {% include quickfacts.html %}
    {{ content }}
    {% include faq.html %}
  </div>
</article>
