title: Varagur.org
tagline: Singing the praise of Varagur Sri Venkatesa Perumal
description: >-
  varagur.org is the knowledge and information hub for Varagur, a village in
  Thanjavur district of Tamil Nadu, India. We cover the Sri Venkatesa Perumal
  Kovil and Sri Maha Kailasanatha Swamy Kovil, the saint-composer Sri Narayana
  Theerthar and his Krishna Leela Tharangini, and the annual Uriyadi festival.
url: "https://varagur.org"
baseurl: ""
author: Varagur.org

google_analytics: G-J8T9MYWS71

permalink: /:categories/:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - scripts/
  - README.md
  - TODO.md
  - vendor/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
